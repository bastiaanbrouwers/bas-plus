name: Sync images from Figma

# Checks every image frame in the Figma file "Portfolio" and publishes the ones that changed.
# Runs every hour, or straight away from the Actions tab (Run workflow).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [figma-update]

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock sharp@0.33
      - name: Sync and check
        id: sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/sync-figma.mjs
      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/images
          [ -f scripts/figma-sync-state.json ] && git add scripts/figma-sync-state.json
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Sync images from Figma"
            git pull --rebase
            git push
          fi
